apiVersion: v1
kind: ServiceAccount
metadata:
  name: dstore-operator
  namespace: dstore-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dstore-operator
rules:
  - apiGroups: ["dstore.amber-store.io"]
    resources: ["dstoreclusters"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["dstore.amber-store.io"]
    resources: ["dstoreclusters/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dstore-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dstore-operator
subjects:
  - kind: ServiceAccount
    name: dstore-operator
    namespace: dstore-system
