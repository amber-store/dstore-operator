apiVersion: v1
kind: Namespace
metadata:
  name: dstore-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dstore-operator
  namespace: dstore-system
  labels:
    app.kubernetes.io/name: dstore-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dstore-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dstore-operator
    spec:
      serviceAccountName: dstore-operator
      containers:
        - name: manager
          image: ghcr.io/amber-store/dstore-operator:latest
          args: ["--leader-elect"]
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
